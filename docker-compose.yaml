
services:

  # -------------------------------
  # PostgreSQL version 17
  # -------------------------------
  db-service:
    image: postgres:17
    container_name: postgres-server-deploy
    environment:
      POSTGRES_DB: dbprod
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - devnestdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d dbprod"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------
  # PGAdmin
  # -------------------------------
  pgadmin-service:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-deploy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin1234
    ports:
      - "8081:80"
    depends_on:
      db-service:
        condition: service_healthy
    restart: always

  # -------------------------------
  # Backend Gestion Employé
  # -------------------------------
  backend-service:
    image: siradia1/backend-employe:1.${BUILD_NUMBER}
    container_name: backend-employe-prod
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://admin:admin123@db-service:5432/dbprod
    depends_on:
      db-service:
        condition: service_healthy
    restart: always

 # ==========================
  # Frontend React
  # ==========================
  frontend-service:
    image: siradia1/frontend-employe:1.${BUILD_NUMBER}
    container_name: frontend-employe-prod
    ports:
      - "3000:80"
    depends_on:
      - backend-service
    restart: always

# -------------------------------
# Volume persistant
# -------------------------------
volumes:
  devnestdata: